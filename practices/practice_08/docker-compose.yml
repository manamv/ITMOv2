services:
  # C# ASP.NET Core Minimal API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linguatype-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - linguatype-net

  # React 19 + Vite Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linguatype-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - linguatype-net

  # Automated Test Runner Service (Vitest Client Tests)
  tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: linguatype-tests
    profiles:
      - test
    networks:
      - linguatype-net

networks:
  linguatype-net:
    driver: bridge
